
<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Ad Gate</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #f0f2f6;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 180px;
        overflow: hidden;
      }
      #unity-container {
        position: relative;
        width: 100%;
        height: 100%;
      }
      #unity-canvas {
        width: 1x;
        height: 1px;
        background: transparent;
        position: absolute;
        top: -100px; /* Keep the actual Unity canvas hidden since it only processes code, not visuals */
      }
      .ad-button {
        background-color: #ff4b4b;
        color: white;
        border: none;
        padding: 14px 28px;
        font-size: 16px;
        font-weight: bold;
        border-radius: 8px;
        cursor: pointer;
        width: 90%;
        max-width: 400px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        transition: transform 0.1s ease, background-color 0.2s ease;
      }
      .ad-button:hover {
        background-color: #e03e3e;
      }
      .ad-button:active {
        transform: scale(0.98);
      }
      .ad-button:disabled {
        background-color: #cccccc;
        cursor: not-allowed;
        box-shadow: none;
      }
      #status-text {
        font-size: 12px;
        color: #555;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>

    <div id="unity-container">
      <!-- HTML Native Interface for your Streamlit Users -->
      <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%;">
        <button id="trigger-ad-btn" class="ad-button" onclick="requestUnityAd()" disabled>
          ⏳ Loading Ad System...
        </button>
        <div id="status-text">Connecting to Unity Network...</div>
      </div>

      <!-- Invisible Unity Target Node -->
      <canvas id="unity-canvas"></canvas>
    </div>

    <script>
      var unityInstanceRef = null;
      var canvas = document.querySelector("#unity-canvas");
      
      // Configuration variables mapped from your standard Unity WebGL Export
      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/webgl.loader.js"; // Standard name from Unity export
      var config = {
        dataUrl: buildUrl + "/webgl.data",
        frameworkUrl: buildUrl + "/webgl.framework.js",
        codeUrl: buildUrl + "/webgl.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "DSLR-Micro-SaaS",
        productVersion: "1.0",
      };

      // 1. Dynamic Engine Loader Injection
      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.getElementById("status-text").innerText = "Loading Modules: " + Math.round(100 * progress) + "%";
        }).then((unityInstance) => {
          unityInstanceRef = unityInstance;
          // Unity is fully loaded and ready to accept ad clicks
          var btn = document.getElementById("trigger-ad-btn");
          btn.removeAttribute("disabled");
          btn.innerText = "▶️ Watch Video to Unlock HD";
          document.getElementById("status-text").innerText = "Ready to unlock.";
        }).catch((message) => {
          alert("Ad engine initialization failed: " + message);
        });
      };
      document.body.appendChild(script);

      // 2. JavaScript UI to Unity Game Engine Trigger Bridge
      function requestUnityAd() {
        if (unityInstanceRef !== null) {
          document.getElementById("trigger-ad-btn").innerText = "📺 Opening Video Ad...";
          document.getElementById("trigger-ad-btn").disabled = true;
          
          // Calls the C# method 'ShowAd' attached to a GameObject named 'AdManager' in Unity
          unityInstanceRef.SendMessage('AdManager', 'ShowAd');
        } else {
          alert("Ad module is still buffering. Please wait a moment.");
        }
      }

      // 3. Unity C# back to Streamlit Web Browser Callback Bridge
      // Your Unity C# script calls this function when the rewarded video ad is successfully completed
      function onAdVideoComplete() {
        document.getElementById("status-text").innerText = "🎉 Verification confirmed!";
        
        // Grab the base URL of the parent Streamlit container layout
        var currentUrl = window.parent.location.href.split('?')[0];
        
        // Push the success token query parameter up to the Streamlit state layer
        window.parent.location.href = currentUrl + "?status=reward_success";
      }

      // Fallback function handling errors or user skips
      function onAdVideoFailed(reason) {
        alert("Ad closed early or failed to display (" + reason + "). Please watch the complete video to unlock your photo.");
        var btn = document.getElementById("trigger-ad-btn");
        btn.removeAttribute("disabled");
        btn.innerText = "▶️ Watch Video to Unlock HD";
        document.getElementById("status-text").innerText = "Please retry.";
      }
    </script>
  </body>
</html>
